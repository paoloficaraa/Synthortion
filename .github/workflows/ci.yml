name: CI (Build & Test)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # =========================================================================
  # 🧪 UI Lint, Typecheck, Test & Build
  # =========================================================================
  ui-checks:
    name: UI Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Typecheck UI
        working-directory: ui
        run: npm run typecheck

      - name: Run Vitest Suite
        working-directory: ui
        run: npm run test:run

      - name: Build UI Production Bundle
        working-directory: ui
        run: npm run build

  # =========================================================================
  # 🪟 Windows Build & Test
  # =========================================================================
  build-windows:
    name: Windows VST3 Build & Test
    runs-on: windows-latest
    steps:
      - name: Checkout repository (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Build Web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Set up NuGet
        uses: nuget/setup-nuget@v2

      - name: Install WebView2 NuGet package
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory ${{ github.workspace }}/packages

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up CMake & Ninja
        uses: lukka/get-cmake@v4.3.3

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/packages"

      - name: Build Plugin & Tests
        run: |
          cmake --build build --config Release --parallel

      - name: Run C++ Unit Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure

  # =========================================================================
  # 🍏 macOS Build & Test
  # =========================================================================
  build-macos:
    name: macOS VST3 & AU Build & Test
    runs-on: macos-latest
    steps:
      - name: Checkout repository (recursive)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: Build Web UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Set up CMake & Ninja
        uses: lukka/get-cmake@v4.3.3

      - name: Configure CMake (Universal arm64 + x86_64)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build Plugin & Tests
        run: |
          cmake --build build --config Release --parallel

      - name: Run C++ Unit Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure
