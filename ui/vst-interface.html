<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synthortion // VST Interface</title>

  <!-- Google Fonts for Body and Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --fg: #ffffff;
      --muted: #888888;
      --border: #333333;
      --accent: #181818;
      /* Typography Fallbacks if Akira Expanded is not local */
      --font-display: 'Akira Expanded', Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
      --font-body: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', 'Space Mono', ui-monospace, monospace;
    }

    body {
      background-color: #030303;
      color: var(--fg);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      margin: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 0;
      overflow: auto;
    }

    .font-display { font-family: var(--font-display); }
    .font-body { font-family: var(--font-body); }
    .font-mono { font-family: var(--font-mono); }

      /* Deadlock Rules */
      .uppercase-tracked {
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      
      .display-tracked {
        letter-spacing: -0.02em;
      }

      .vst-container {
        width: 880px;
        background: var(--bg);
        border: 1px solid var(--border);
        box-shadow: 0 60px 100px -20px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.1) inset;
        user-select: none;
        position: relative;
        overflow: hidden;
      }

    .vst-container::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.025'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 50;
      mix-blend-mode: overlay;
    }

    /* Motion Discipline */
    @keyframes vst-enter {
      0% { opacity: 0; transform: translateY(12px) scale(0.99); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-vst-enter {
      animation: vst-enter 220ms cubic-bezier(0.2, 0, 0, 1) both;
    }
    @media (prefers-reduced-motion: reduce) {
      .animate-vst-enter {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: 'var(--bg)',
            surface: 'var(--surface)',
            fg: 'var(--fg)',
            muted: 'var(--muted)',
            border: 'var(--border)',
            accent: 'var(--accent)',
          }
        }
      }
    }
  </script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Components ---

    function GainMeter({ label, active, side, delay = 0, children }) {
      const canvasRef = useRef(null);
      const levelRef = useRef(0);
      
      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let raf;
        
        const draw = () => {
          ctx.fillStyle = '#020202';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          if (active) {
            const rawTarget = Math.random() > 0.05 ? (Math.random() * 0.7 + 0.2) : Math.random() * 0.99;
            levelRef.current += (rawTarget - levelRef.current) * 0.25;
          } else {
            levelRef.current += (0 - levelRef.current) * 0.2;
          }
          
          const blocks = 32;
          const blockH = canvas.height / blocks;
          const activeCount = Math.floor(levelRef.current * blocks);
          
          for(let i = 0; i < blocks; i++) {
            const y = canvas.height - (i + 1) * blockH;
            const isFilled = i < activeCount;
            const isPeak = i >= (blocks - 3); 
            
            if (isFilled) {
               ctx.fillStyle = isPeak ? '#ffffff' : '#888888';
            } else {
               ctx.fillStyle = '#0a0a0a';
            }
            
            ctx.fillRect(0, y + 2, canvas.width, Math.max(2, blockH - 4));
          }
          
          if (active || levelRef.current > 0.01) {
            raf = requestAnimationFrame(draw);
          } else {
             ctx.fillStyle = '#020202';
             ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
        };
        
        if (active) draw();
        else raf = requestAnimationFrame(draw);
        
        return () => cancelAnimationFrame(raf);
      }, [active]);

      const borderClass = side === 'left' ? 'border-r border-[#222]' : 'border-l border-[#222]';
      
      return (
        <div className={`w-[40px] shrink-0 bg-[#050505] flex flex-col items-center py-6 ${borderClass} z-10 relative animate-vst-enter shadow-[inset_0_0_12px_rgba(0,0,0,0.8)]`} style={{ animationDelay: delay + 'ms' }}>
          <div className="font-display text-[8px] text-[#666] uppercase-tracked mb-5">{label}</div>
          <div className="font-mono text-[7px] text-[#444] mb-2 font-bold leading-none">0</div>
          <div className="flex-1 w-full flex justify-center z-10 shrink min-h-0">
             <div className="w-[6px] h-full" style={{ boxShadow: '0 0 0 1px #222' }}>
               <canvas ref={canvasRef} width={12} height={800} className="w-full h-full block" />
             </div>
          </div>
          <div className="font-mono text-[7px] text-[#444] mt-2 font-bold leading-none">-INF</div>
          {children && (
            <div className="mt-5 mb-1 flex flex-col items-center relative z-20">
              {children}
            </div>
          )}
        </div>
      );
    }

    function Knob({ label, value, min = 0, max = 100, displayValue, onChange, size = 'default' }) {
      const knobRef = useRef(null);
      const isDragging = useRef(false);
      const [isDraggingState, setIsDraggingState] = useState(false);
      const startY = useRef(0);
      const startVal = useRef(0);

      const handlePointerDown = (e) => {
        isDragging.current = true;
        setIsDraggingState(true);
        startY.current = e.clientY;
        startVal.current = value;
        e.target.setPointerCapture(e.pointerId);
      };

      const handlePointerMove = (e) => {
        if (!isDragging.current) return;
        const dy = startY.current - e.clientY;
        const sensitivity = 0.5;
        let newValue = startVal.current + dy * sensitivity * ((max - min) / 100);
        newValue = Math.max(min, Math.min(max, newValue));
        onChange(newValue);
      };

      const handlePointerUp = (e) => {
        isDragging.current = false;
        setIsDraggingState(false);
        e.target.releasePointerCapture(e.pointerId);
      };

      const handleKeyDown = (e) => {
        const step = (max - min) / 100;
        const largeStep = (max - min) / 10;
        let newValue = value;
        
        switch (e.key) {
          case 'ArrowUp':
          case 'ArrowRight':
            newValue += e.shiftKey ? largeStep : step;
            break;
          case 'ArrowDown':
          case 'ArrowLeft':
            newValue -= e.shiftKey ? largeStep : step;
            break;
          case 'Home':
            newValue = min;
            break;
          case 'End':
            newValue = max;
            break;
          default:
            return;
        }
        e.preventDefault();
        newValue = Math.max(min, Math.min(max, newValue));
        onChange(newValue);
      };

      const radius = size === 'small' ? 14 : 22;
      const viewBoxSize = size === 'small' ? 40 : 64;
      const center = viewBoxSize / 2;
      const pct = (value - min) / (max - min);
      const angle = -135 + (pct * 270);
      
      const C = 2 * Math.PI * radius;
      const maxArcLength = C * 0.75;
      const strokeDashoffset = C - Math.max(0.001, (pct * maxArcLength));
      const bgStrokeDashoffset = C - maxArcLength;

      return (
        <div className="flex flex-col items-center gap-1.5">
          <div 
            ref={knobRef}
            role="slider"
            tabIndex={0}
            aria-label={label}
            aria-valuemin={min}
            aria-valuemax={max}
            aria-valuenow={Math.round(value)}
            aria-valuetext={displayValue}
            className={`relative cursor-ns-resize group rounded-full focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-fg focus-visible:ring-offset-4 focus-visible:ring-offset-bg transition-transform duration-[140ms] ease-out ${isDraggingState ? 'scale-[1.05]' : 'scale-100'} flex items-center justify-center`}
            style={{ width: viewBoxSize, height: viewBoxSize }}
            onPointerDown={handlePointerDown}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onKeyDown={handleKeyDown}
          >
            <svg className="absolute inset-0 w-full h-full" viewBox={`0 0 ${viewBoxSize} ${viewBoxSize}`}>
               <circle cx={center} cy={center} r={radius} fill="none" stroke="var(--border)" strokeWidth={size === 'small' ? "2" : "3"} strokeDasharray={C} strokeDashoffset={bgStrokeDashoffset} transform={`rotate(135 ${center} ${center})`} strokeLinecap="round" />
               <circle cx={center} cy={center} r={radius} fill="none" stroke="var(--fg)" strokeWidth={size === 'small' ? "2" : "3"} strokeDasharray={C} strokeDashoffset={strokeDashoffset} transform={`rotate(135 ${center} ${center})`} strokeLinecap="round" className="transition-all duration-75" />
               <circle cx={center} cy={center} r={radius - (size === 'small' ? 5 : 7)} fill="#111" stroke="#222" strokeWidth="1" />
               <g transform={`rotate(${angle} ${center} ${center})`}>
                  <line x1={center} y1={center - (radius - (size === 'small' ? 5 : 7))} x2={center} y2={center - (radius - (size === 'small' ? -1 : -2))} stroke="var(--fg)" strokeWidth={size === 'small' ? "1.5" : "2"} strokeLinecap="round" />
               </g>
            </svg>
          </div>
          <div className="flex flex-col items-center mt-1">
            <span className={`font-mono text-fg uppercase-tracked select-none ${size === 'small' ? 'text-[9px]' : 'text-[10px]'}`}>{displayValue}</span>
            <span className={`font-display text-muted uppercase-tracked select-none mt-1 ${size === 'small' ? 'text-[8px]' : 'text-[9px]'}`} aria-hidden="true">{label}</span>
          </div>
        </div>
      );
    }

    function FFTVisualizer({ active }) {
      const canvasRef = useRef(null);
      const dataArray = useRef(new Float32Array(128).fill(0));
      
      useEffect(() => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        let raf;
        let phase = 0;
        
        const draw = () => {
          ctx.fillStyle = '#0a0a0a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          
          const bars = 100;
          const barWidth = canvas.width / bars;
          
          for(let i = 0; i < bars; i++) {
            const structuralNoise = Math.sin(phase + i * 0.2) * 5 + Math.cos(phase * 1.5 - i * 0.1) * 10;
            const boost = (i > 10 && i < 30) ? 20 : 0;
            const rawTarget = active ? (Math.random() * 20 + structuralNoise + boost + 10) : 1;
            const target = Math.max(1, rawTarget);
            
            dataArray.current[i] += (target - dataArray.current[i]) * 0.15;
            
            const height = Math.floor(dataArray.current[i] * (canvas.height / 100));
            const x = Math.floor(i * barWidth);
            const y = canvas.height - height;
            
            ctx.fillStyle = active ? '#ffffff' : '#333333';
            ctx.fillRect(x, y, Math.max(1, Math.floor(barWidth) - 1), height);
          }
          
          phase += 0.1;
          if (active) raf = requestAnimationFrame(draw);
        };
        
        if (active) draw();
        return () => cancelAnimationFrame(raf);
      }, [active]);

      return (
        <div className="relative w-full h-[220px] bg-[#0a0a0a] overflow-hidden border-b border-border shadow-[inset_0_-1px_3px_rgba(0,0,0,0.5)]">
           <canvas ref={canvasRef} className="w-full h-full block" width={800} height={220} />
           
           {/* Hardware Bezel Shadow */}
           <div className="absolute inset-0 pointer-events-none shadow-[inset_0_12px_24px_rgba(0,0,0,0.9)]"></div>
           
           <div className="absolute bottom-3 right-4 flex gap-6 opacity-30">
             <span className="font-mono text-[9px] text-fg">20Hz</span>
             <span className="font-mono text-[9px] text-fg">200Hz</span>
             <span className="font-mono text-[9px] text-fg">2kHz</span>
             <span className="font-mono text-[9px] text-fg">20kHz</span>
           </div>
        </div>
      );
    }

    function App() {
      const [drive, setDrive] = useState(40);
      const [driveRoute, setDriveRoute] = useState('PRE');
      const [bitcrush, setBitcrush] = useState(12);
      const [delayMix, setDelayMix] = useState(30);
      const [delayTime, setDelayTime] = useState(250);
      const [delayFbk, setDelayFbk] = useState(50);
      const [delaySync, setDelaySync] = useState('SYNC');
      const [chorus, setChorus] = useState(75);
      const [chorusWide, setChorusWide] = useState(false);
      const [inputGain, setInputGain] = useState(0);
      const [outputGain, setOutputGain] = useState(0);
      
      const [engineActive, setEngineActive] = useState(true);
      const [booting, setBooting] = useState(true);
      const [scale, setScale] = useState(1);
      const containerRef = useRef(null);
      const [containerHeight, setContainerHeight] = useState(600);

      useEffect(() => {
        const bootTimer = setTimeout(() => setBooting(false), 900);
        return () => clearTimeout(bootTimer);
      }, []);

      useEffect(() => {
        const handleResize = () => {
          if (!containerRef.current) return;
          const W = 880;
          const H = containerRef.current.offsetHeight || 600;
          if (H !== containerHeight) setContainerHeight(H);
          
          const margin = 32;
          const scaleW = (window.innerWidth - margin) / W;
          setScale(Math.min(1, scaleW));
        };
        handleResize();
        setTimeout(handleResize, 50);
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);

      const btnClass = (isActive) => `flex-1 border font-mono text-[9px] py-1.5 uppercase transition-all duration-75 ease-out active:scale-[0.96] outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-fg ${isActive ? 'bg-fg text-bg border-fg shadow-[inset_0_1px_2px_rgba(0,0,0,0.5)]' : 'bg-transparent border-border text-muted hover:bg-fg hover:text-bg hover:border-fg'}`;

      return (
        <div style={{ transform: `scale(${scale})`, transformOrigin: 'top center', height: containerHeight * scale, minWidth: 880 * scale }}>
          <div ref={containerRef} className="vst-container flex flex-row mx-auto max-w-full relative" data-od-id="vst-main">
          
          {booting && (
            <div className="absolute inset-0 z-[100] bg-bg flex flex-col items-center justify-center font-mono text-muted text-[10px] uppercase-tracked">
              <div className="flex flex-col items-start w-[240px]">
                 <span className="mb-3 text-fg animate-pulse">// SYSTEM_BOOT</span>
                 <span className="animate-vst-enter" style={{ animationDelay: '100ms' }}>[OK] CORE KERNEL</span>
                 <span className="animate-vst-enter" style={{ animationDelay: '250ms' }}>[OK] DSP ENGINE</span>
                 <span className="animate-vst-enter" style={{ animationDelay: '500ms' }}>[OK] UI MOUNT</span>
              </div>
            </div>
          )}

          {/* Rack Screws */}
          <div className="absolute top-4 left-4 w-1.5 h-1.5 rounded-full border border-[rgba(255,255,255,0.05)] bg-[#050505] shadow-[inset_0_1px_1px_rgba(0,0,0,1)] z-50"></div>
          <div className="absolute top-4 right-4 w-1.5 h-1.5 rounded-full border border-[rgba(255,255,255,0.05)] bg-[#050505] shadow-[inset_0_1px_1px_rgba(0,0,0,1)] z-50"></div>
          <div className="absolute bottom-4 left-4 w-1.5 h-1.5 rounded-full border border-[rgba(255,255,255,0.05)] bg-[#050505] shadow-[inset_0_1px_1px_rgba(0,0,0,1)] z-50"></div>
          <div className="absolute bottom-4 right-4 w-1.5 h-1.5 rounded-full border border-[rgba(255,255,255,0.05)] bg-[#050505] shadow-[inset_0_1px_1px_rgba(0,0,0,1)] z-50"></div>

          <GainMeter label="IN" active={engineActive && !booting} side="left" delay={50}>
            <Knob label="TRIM" value={inputGain} min={-24} max={24} displayValue={Math.round(inputGain) > 0 ? `+${Math.round(inputGain)}` : `${Math.round(inputGain)}`} size="small" onChange={setInputGain} />
          </GainMeter>

          <div className="flex flex-col flex-1 min-w-0">

          {/* Header */}
          <header className="h-[64px] bg-bg border-b border-border flex items-center justify-between px-8 shrink-0 relative animate-vst-enter" style={{ animationDelay: '0ms' }}>
            <div className="flex items-center gap-5 relative z-10">
              <button 
                onClick={() => setEngineActive(!engineActive)} 
                aria-pressed={engineActive} 
                aria-label={engineActive ? "Disable main DSP" : "Enable main DSP"}
                title="Bypass"
                className={`w-3.5 h-3.5 rounded-[1px] border border-border outline-none focus-visible:ring-2 focus-visible:ring-fg focus-visible:ring-offset-2 focus-visible:ring-offset-bg transition-colors ${engineActive ? 'bg-fg border-fg shadow-[0_0_8px_rgba(255,255,255,0.7)]' : 'bg-[#1x1x1x]'}`}
              ></button>
              <h1 className="font-display text-[16px] text-fg display-tracked mt-1 select-none">SYNTHORTION</h1>
            </div>
            
            {/* Embedded LCD Screen for Presets */}
            <div className="flex items-center gap-4 relative z-10 bg-[#050505] px-3 py-2 border border-border shadow-[inset_0_2px_4px_rgba(0,0,0,1)] rounded-sm">
              <div className="flex flex-col justify-center font-mono text-[9px] uppercase-tracked mx-2 pr-4 border-r border-[#222]">
                <span className="text-[#555] text-[7px] mb-0.5" aria-hidden="true">PRESET</span>
                <span className="text-fg font-bold tracking-widest pointer-events-auto cursor-pointer hover:text-white transition-colors" tabIndex={0} role="button" aria-label="Select Preset">INIT_STATE_01</span>
              </div>
              <div className="flex gap-1 shrink-0 ml-1">
                <button className="px-3 py-1 bg-transparent border border-transparent text-muted font-display text-[8px] uppercase-tracked hover:bg-fg hover:text-bg hover:border-fg transition-all duration-[75ms] ease-out active:scale-[0.94] outline-none focus-visible:bg-fg focus-visible:text-bg">SAVE</button>
                <button className="px-3 py-1 bg-transparent border border-transparent text-muted font-display text-[8px] uppercase-tracked hover:bg-fg hover:text-bg hover:border-fg transition-all duration-[75ms] ease-out active:scale-[0.94] outline-none focus-visible:bg-fg focus-visible:text-bg">LOAD</button>
              </div>
            </div>
          </header>

          {/* Body */}
          <main className="flex-1 flex flex-col bg-bg border-t border-[#222]">
            
            <div data-od-id="fft-container" className="animate-vst-enter" style={{ animationDelay: '50ms' }}>
              <FFTVisualizer active={engineActive} />
            </div>

            {/* Matrix Faceplate */}
            <div className="grid grid-cols-5 divide-x divide-border" data-od-id="controls-grid">
              
              {/* Drive */}
              <div className="p-6 pb-6 flex flex-col items-center justify-between relative group hover:bg-[#050505] transition-colors animate-vst-enter" style={{ animationDelay: '100ms' }}>
                <div className="absolute top-4 left-4 text-[#555] font-display text-[9px] uppercase-tracked" aria-hidden="true">DRV</div>
                <div className="flex-1 flex flex-col justify-center items-center mt-6 w-full">
                  <Knob label="Drive" value={drive} min={0} max={100} displayValue={`${Math.round(drive)}%`} onChange={setDrive} />
                </div>
                <div className="w-full flex gap-1 mt-8 opacity-40 hover:opacity-100 transition-opacity">
                  <button onClick={() => setDriveRoute('PRE')} aria-pressed={driveRoute === 'PRE'} className={btnClass(driveRoute === 'PRE')}>PRE</button>
                  <button onClick={() => setDriveRoute('POST')} aria-pressed={driveRoute === 'POST'} className={btnClass(driveRoute === 'POST')}>POST</button>
                </div>
              </div>
              
              {/* Bitcrush */}
              <div className="p-6 pb-6 flex flex-col items-center justify-between relative group hover:bg-[#050505] transition-colors animate-vst-enter" style={{ animationDelay: '140ms' }}>
                <div className="absolute top-4 left-4 text-[#555] font-display text-[9px] uppercase-tracked" aria-hidden="true">BCR</div>
                <div className="flex-1 flex flex-col justify-center items-center mt-6 w-full">
                  <Knob label="Bitcrush" value={bitcrush} min={2} max={24} displayValue={`${Math.round(bitcrush)}B`} onChange={setBitcrush} />
                </div>
                <div className="w-full flex gap-1 mt-8 opacity-0 pointer-events-none">
                  {/* Spacer to align knobs symmetrically */}
                  <button className={btnClass(false)}>-</button>
                </div>
              </div>
              
              {/* Delay */}
              <div className="col-span-2 p-6 pb-6 flex flex-col flex-1 items-center justify-between relative group hover:bg-[#050505] transition-colors shadow-[inset_1px_0_0_0_#222] animate-vst-enter" style={{ animationDelay: '180ms' }}>
                <div className="absolute top-4 left-4 text-[#555] font-display text-[9px] uppercase-tracked" aria-hidden="true">DLY</div>
                <div className="flex-1 flex flex-col items-center justify-center w-full mt-2">
                  <Knob label="Mix" value={delayMix} min={0} max={100} displayValue={`${Math.round(delayMix)}%`} onChange={setDelayMix} />
                  <div className="flex gap-10 mt-6">
                    <Knob label="Time" value={delayTime} min={0} max={1000} displayValue={`${Math.round(delayTime)}`} size="small" onChange={setDelayTime} />
                    <Knob label="Fbk" value={delayFbk} min={0} max={100} displayValue={`${Math.round(delayFbk)}%`} size="small" onChange={setDelayFbk} />
                  </div>
                </div>
                <div className="w-[80%] max-w-[200px] flex gap-1 mt-8 opacity-40 hover:opacity-100 transition-opacity mx-auto">
                  <button onClick={() => setDelaySync('SYNC')} aria-pressed={delaySync === 'SYNC'} className={btnClass(delaySync === 'SYNC')}>SYNC</button>
                  <button onClick={() => setDelaySync('FREE')} aria-pressed={delaySync === 'FREE'} className={btnClass(delaySync === 'FREE')}>FREE</button>
                  <button onClick={() => setDelaySync('PING-PONG')} aria-pressed={delaySync === 'PING-PONG'} className={btnClass(delaySync === 'PING-PONG')}>PANG</button>
                </div>
              </div>

              {/* Chorus */}
              <div className="p-6 pb-6 flex flex-col items-center justify-between relative group shadow-[inset_1px_0_0_0_#222] hover:bg-[#050505] transition-colors animate-vst-enter" style={{ animationDelay: '220ms' }}>
                <div className="absolute top-4 left-4 text-[#555] font-display text-[9px] uppercase-tracked" aria-hidden="true">CHR</div>
                <div className="flex-1 flex flex-col justify-center items-center mt-6 w-full">
                  <Knob label="Chorus" value={chorus} min={0} max={100} displayValue={`${Math.round(chorus)}%`} onChange={setChorus} />
                </div>
                <div className="w-full mt-8 opacity-40 hover:opacity-100 transition-opacity">
                  <button onClick={() => setChorusWide(!chorusWide)} aria-pressed={chorusWide} className={btnClass(chorusWide)}>WIDE</button>
                </div>
              </div>

            </div>
          </main>
          
          </div>
          
          <GainMeter label="OUT" active={engineActive && !booting} side="right" delay={260}>
            <Knob label="TRIM" value={outputGain} min={-24} max={24} displayValue={Math.round(outputGain) > 0 ? `+${Math.round(outputGain)}` : `${Math.round(outputGain)}`} size="small" onChange={setOutputGain} />
          </GainMeter>

        </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
